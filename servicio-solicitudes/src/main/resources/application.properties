# La solicitud de conexión a la base de datos viene de la configuracion (entorno), no hardcodeada.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/arka}
spring.datasource.username=${DB_USER:arka}
spring.datasource.password=${DB_PASSWORD:arka}

#Hibernate valida contra el esquema real (schema.sql); no lo genera solo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Ejecuta schema.sql al arrancar (las tablas de la clase de modelado, s45)
spring.sql.init.mode=always

spring.application.name=servicio-solicitudes
notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8081/eventos/solicitud-enviada}
