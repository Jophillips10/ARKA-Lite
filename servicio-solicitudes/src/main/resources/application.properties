# La solicitud de conexión a la base de datos viene de la configuracion (entorno), no hardcodeada.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/arka}
spring.datasource.username=${DB_USER:arka}
spring.datasource.password=${DB_PASSWORD:arka}

#Hibernate valida contra el esquema real (schema.sql); no lo genera solo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Ejecuta schema.sql al arrancar (las tablas de la clase de modelado, s45)
spring.sql.init.mode=always

spring.application.name=servicio-solicitudes
notificaciones.url=${NOTIFICACIONES_URL:http://servicio-notificaciones:8080/eventos/solicitud-enviada}

# --- Observabilidad: instrumentacion basica de un servicio (referencia S54) ---
# Actuator: exponer salud y metricas
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

# Logs ESTRUCTURADOS en JSON (Spring Boot nativo): cada log es un objeto con campos
logging.structured.format.console=ecs

# Trazabilidad: muestrear el 100% en desarrollo (en prod se baja)
management.tracing.sampling.probability=1.0
