spring.application.name=servicio-notificaciones
# --- Observabilidad: instrumentacion basica de un servicio (referencia S54) ---
# Actuator: exponer salud y metricas
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

# Logs ESTRUCTURADOS en JSON (Spring Boot nativo): cada log es un objeto con campos
logging.structured.format.console=ecs

# Trazabilidad: muestrear el 100% en desarrollo (en prod se baja)
management.tracing.sampling.probability=1.0
# Con Micrometer Tracing, el traceId/spanId entran al MDC y salen en
