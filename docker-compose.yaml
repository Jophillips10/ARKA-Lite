services:
  servicio-notificaciones:
    build: ./servicio-notificaciones
    ports:
      - "8081:8080"

  servicio-solicitudes:
    build: ./servicio-solicitudes
    ports:
      - "8080:8080"
    environment:
      NOTIFICACIONES_URL: http://servicio-notificaciones:8080/eventos/solicitud-enviada
    depends_on:
      - servicio-notificaciones
