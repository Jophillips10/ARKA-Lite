services:
  base-datos-solicitudes:
    image: postgres:17
    environment:
      POSTGRES_USER: arka
      POSTGRES_PASSWORD: arka
      POSTGRES_DB: arka
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arka -d arka -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  base-datos-notificaciones:
    image: postgres:17
    environment:
      POSTGRES_USER: arka
      POSTGRES_PASSWORD: arka
      POSTGRES_DB: notificaciones
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arka -d notificaciones -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  servicio-notificaciones:
    build: ./servicio-notificaciones
    ports:
      - "8081:8080"
    depends_on:
       base-datos-notificaciones:
        condition: service_healthy #no se inicia hasta que la base de datos esté lista
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://base-datos-notificaciones:5432/notificaciones
      SPRING_DATASOURCE_USERNAME: arka
      SPRING_DATASOURCE_PASSWORD: arka

  servicio-solicitudes:
    build: ./servicio-solicitudes
    ports:
      - "8080:8080"
    environment:
      #la base se alcanza por nombre de servicio (base-datos), vía config - el patron de s15
      DB_URL: jdbc:postgresql://base-datos-solicitudes:5432/arka
      DB_USER: arka
      DB_PASSWORD: arka
      NOTIFICACIONES_URL: http://servicio-notificaciones:8080/eventos/solicitud-enviada
    depends_on:
      base-datos-solicitudes:
        condition: service_healthy #no se inicia hasta que la base de datos esté lista

  loki: # almacén + consulta de logs (la "sala de control")
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml
    ports: [ "3100:3100" ]

  promtail: # recolecta los logs de TODOS los contenedores y los manda a Loki
    image: grafana/promtail:3.0.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on: [ loki ]

  grafana: # el TABLERO: en 'Explore' se buscan las trazas por traceId
    image: grafana/grafana:11.0.0
    ports: [ "3000:3000" ]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    depends_on: [ loki ]